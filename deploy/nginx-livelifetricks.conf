# Nginx site for livelifetricks.com
# Copy to /etc/nginx/sites-available/livelifetricks.com and enable it (see README.md).
# Certbot will add the HTTPS (port 443) parts automatically.

server {
    listen 80;
    listen [::]:80;
    server_name livelifetricks.com www.livelifetricks.com;

    root /var/www/livelifetricks.com;
    index index.html;

    # Always use the non-www address
    if ($host = www.livelifetricks.com) {
        return 301 $scheme://livelifetricks.com$request_uri;
    }

    # Clean URLs: /emi-calculator -> /emi-calculator/
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    # CSS/JS have a version in the URL, so they can be cached for a year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    location ~* \.(png|svg|ico|webmanifest)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=300";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain application/manifest+json;
}
