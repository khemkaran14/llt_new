# Sends the biodata API and admin dashboard to the Node server.
# Include this INSIDE the "server { ... }" block that has "listen 443" in
# /etc/nginx/conf.d/livelifetricks.com.conf:
#     include /root/livelifetricks/deploy/nginx-api.conf;

location /api/ {
    proxy_pass http://127.0.0.1:3077;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 300k;
}

location = /admin {
    proxy_pass http://127.0.0.1:3077;
    proxy_set_header X-Real-IP $remote_addr;
}
location = /admin/ { return 301 /admin; }
