# Sends the API, admin dashboard and blog to the Node server.
# Include this INSIDE the "server { ... }" block that has "listen 443" in
# /etc/nginx/conf.d/livelifetricks.com.conf:
#     include /root/livelifetricks/deploy/nginx-api.conf;

location /api/ {
    proxy_pass http://127.0.0.1:3077;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 300k;
}

# Admin: blog image uploads and long posts need more room
location = /api/admin/upload {
    proxy_pass http://127.0.0.1:3077;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 5m;
}
location = /api/admin/posts/save {
    proxy_pass http://127.0.0.1:3077;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 1m;
}
location = /api/admin/posts/preview {
    proxy_pass http://127.0.0.1:3077;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 1m;
}

location = /admin {
    proxy_pass http://127.0.0.1:3077;
    proxy_set_header X-Real-IP $remote_addr;
}
location = /admin/ { return 301 /admin; }

# Blog pages, RSS feed and uploaded images
location /blog {
    proxy_pass http://127.0.0.1:3077;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}
location /blog-media/ {
    proxy_pass http://127.0.0.1:3077;
    expires 365d;
}

# Internal page template used by the blog; not a public page
location /_shell/ { return 404; }
